    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Google Fonts 优化：
      1) 合并为单个请求，减少字重（仅保留实际使用的 400/500/600/700）
      2) 去掉 Playfair Display 的 italic 和 500/600/800 字重
      3) 使用 preload + onload 模式将字体 CSS 移出关键渲染路径（非阻塞），
         浏览器先用 system-ui 回退字体渲染，加载完成后通过 display=swap 切换。
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Noto+Sans+IPA&family=Noto+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Courier+Prime:wght@400;700&family=Noto+Sans+IPA&family=Noto+Sans:wght@400;500;600;700&display=swap" /></noscript>
